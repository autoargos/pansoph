  <title>pansoph constellation lockup mono</title>
  <title>pansoph - constellation mark</title>
  <!--
    Linked nodes forming a lowercase "p": a vertical spine of nodes (the stem)
    with a closed loop of nodes at the top-right (the bowl).
    Many sources -> one access-controlled knowledge graph. One node (the hub of
    the bowl) is accented = the point of governed access.
    Grid: 128 canvas. Nodes on integer coordinates for optical alignment.
  -->
  <g fill="none" stroke="#12161F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- edges: stem -->
    <path d="M40 30 L40 104"/>
    <!-- edges: bowl loop (p head) -->
    <path d="M40 44 L78 30"/>
    <path d="M78 30 L100 58"/>
    <path d="M100 58 L82 84"/>
    <path d="M82 84 L40 78"/>
    <!-- inner chord that closes the graph and hints the counter of the p -->
    <path d="M78 30 L82 84"/>
  </g>

