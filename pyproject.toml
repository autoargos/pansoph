# pansoph workspace root.
# This is a uv workspace. Each member under packages/ is an independently
# publishable distribution. The root itself is not published.

[project]
name = "pansoph-workspace"
version = "0.0.0"
description = "Workspace root for pansoph, a modular knowledge platform with ground up RBAC."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# The root has no runtime deps. It depends on the members for local development.
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "vcrpy>=6",
  "pytest-recording>=0.13",
  "syrupy>=4.7",
]

[tool.uv.workspace]
members = ["packages/*", "connectors/*"]

[tool.uv.sources]
pansoph-types = { workspace = true }
pansoph-connector-sdk = { workspace = true }
pansoph-authz = { workspace = true }
pansoph-retrieval = { workspace = true }
pansoph-ingestion = { workspace = true }
pansoph-mcp-bridge = { workspace = true }
pansoph-identity = { workspace = true }
pansoph-infra = { workspace = true }
pansoph-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101 assert is fine in tests; configured per directory below.

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are the idiomatic argument defaults; they are
# not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# S101 assert; S105/S106 literal "token"/"consistency_token" test values are not secrets.
"tests/**" = ["S101", "S105", "S106"]
"**/tests/**" = ["S101", "S105", "S106"]
# The conformance harness uses assert as its public contract check.
"**/conformance.py" = ["S101"]
# The verification engine is the conformance harness: assert is its public contract
# check (like conformance.py above), and it reads small fixture files synchronously
# inside async category functions, which ASYNC240 flags but is intended here.
"**/verify/**" = ["S101", "ASYNC240"]
# Vector queries interpolate only an internal constant WHERE clause; all values
# are bound parameters, so the S608 string-query warning is a false positive here.
"**/adapters_vector.py" = ["S608"]
# The Salesforce REST query API takes SOQL as a string with no bind parameters. The
# object name is operator config and the id is a Salesforce-issued key, so the S608
# string-query warning has no safe alternative here.
"connectors/salesforce/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "connectors", "tests"]
markers = [
  "permission: document level access control red team tests that gate releases",
  "integration: tests that need live services (postgres, spicedb, ...)",
  "conformance: connector conformance suite, hermetic and offline",
]
