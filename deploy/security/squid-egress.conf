# Egress allowlist for the scribe workers and untrusted connector code.
# Workers reach only model providers and the configured sources, nothing else.
# The cloud metadata endpoint is blocked outright.

# Block the cloud metadata IP (SSRF protection).
acl metadata dst 169.254.169.254
http_access deny metadata

# Allowlisted destinations. Add the domains your connectors and model provider need.
acl allowed_dst dstdomain .githubusercontent.com .github.com
acl allowed_dst dstdomain .googleapis.com .google.com
acl allowed_dst dstdomain .atlassian.net
acl allowed_dst dstdomain generativelanguage.googleapis.com openrouter.ai
acl allowed_dst dstdomain .huggingface.co

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow allowed_dst
# Everything not explicitly allowed is denied.
http_access deny all

http_port 3128
