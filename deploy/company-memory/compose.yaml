# DOOR3 Company Memory: LOCAL POC ONLY. Synthetic data, one developer laptop.
#
# A standalone stack (not an overlay merged onto the upstream compose.yaml, because
# compose merges `ports` additively and the upstream file publishes everything on
# 0.0.0.0). Hardening versus upstream (CM-B1, CM-B2):
#   - only three ports are published, all on 127.0.0.1: Keycloak (login), agora (REST),
#     and the Company Memory MCP. Postgres, SpiceDB, and the embedder are not published.
#   - every secret is generated by `company-memory init` into .secrets/ (gitignored);
#     compose refuses to start without them (the `:?` expansions), and the services refuse
#     default values at startup (company_memory_mcp.guards).
#   - PANSOPH_REQUIRE_AUTH=true and the OIDC identity adapter, so there is no body
#     identity fall back and no builtin "token is a user id" adapter.
#   - groups are read from Keycloak userinfo per request, so an IdP group removal applies
#     on the next query.
#   - /api/grab and the API docs are not mounted (company_memory_mcp.agora_app).
#   - no lens UI, no Valkey, no object store, no OpenBao, no LLM: not needed for the demo.
#
# Use the CLI rather than raw compose: `uv run company-memory up` (see
# docs/company-memory/DEMO.md). Raw equivalent:
#   docker compose -f deploy/company-memory/compose.yaml \
#     --env-file deploy/company-memory/.secrets/stack.env up -d --build --wait

name: company-memory

x-restart: &restart
  restart: unless-stopped

x-pansoph-env: &pansoph-env
  # Marks these containers as the LOCAL Company Memory demo. `company-memory demo-reset`
  # (company_memory_mcp.demo_state) refuses to touch any environment without it.
  CM_DEMO_ENV: local-poc
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: pansoph
  POSTGRES_USER: pansoph
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run company-memory init}
  SPICEDB_ENDPOINT: spicedb:50051
  SPICEDB_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY:?run company-memory init}
  PANSOPH_ENVELOPE_ROOT_KEY: ${PANSOPH_ENVELOPE_ROOT_KEY:?run company-memory init}
  PANSOPH_REQUIRE_AUTH: "true"
  PANSOPH_AUTHZ_ADAPTER: spicedb
  PANSOPH_VECTOR_ADAPTER: pgvectorscale
  PANSOPH_PARSER_ADAPTER: docling
  PANSOPH_EMBEDDER_ADAPTER: tei
  PANSOPH_EMBEDDER_URL: http://tei-embed:80
  PANSOPH_EMBEDDER_MODEL: BAAI/bge-small-en-v1.5
  PANSOPH_EMBEDDER_DIM: "384"
  # OIDC plus Company Memory rules: the principal is the verified email, and only users
  # in a configured-user group authenticate (company_memory_mcp.identity).
  PANSOPH_IDENTITY_ADAPTER: company_memory
  OIDC_REQUIRE_VERIFIED_EMAIL: "true"
  CM_REQUIRED_GROUPS: everyone,cm-service-accounts
  # The issuer is the browser/CLI facing URL (what tokens carry); keys and userinfo are
  # fetched over the internal network.
  OIDC_ISSUER_URL: http://localhost:8090/realms/company-memory
  OIDC_JWKS_URL: http://keycloak:8080/realms/company-memory/protocol/openid-connect/certs
  OIDC_USERINFO_URL: http://keycloak:8080/realms/company-memory/protocol/openid-connect/userinfo
  OIDC_GROUPS_FROM_USERINFO: "true"
  # Tokens must be minted for the Company Memory resource (audience).
  OIDC_CLIENT_ID: company-memory
  PANSOPH_MCP_PUBLIC_URL: http://localhost:8765/mcp

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pansoph
      POSTGRES_USER: pansoph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run company-memory init}
    volumes:
      - cm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pansoph -d pansoph"]
      interval: 5s
      timeout: 3s
      retries: 20

  spicedb-migrate:
    image: authzed/spicedb:v1.47.1
    restart: "no"
    command:
      - datastore
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://pansoph:${POSTGRES_PASSWORD}@postgres:5432/pansoph?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  spicedb:
    <<: *restart
    image: authzed/spicedb:v1.47.1
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_PRESHARED_KEY:?run company-memory init}
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://pansoph:${POSTGRES_PASSWORD}@postgres:5432/pansoph?sslmode=disable
    depends_on:
      spicedb-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    # Dev mode (HTTP, embedded store) is acceptable only because this stack is loopback
    # bound and synthetic. The realm is rendered by `company-memory init` with generated
    # passwords; the bootstrap admin password is generated too (no default admin login).
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: cm-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run company-memory init}
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./.secrets/realm-company-memory.json:/opt/keycloak/data/import/realm-company-memory.json:ro
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  tei-embed:
    <<: *restart
    # Small CPU embedding model (384 dims) so the demo runs on a laptop. The model is
    # downloaded from Hugging Face on first start and cached in the volume.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    # TEI publishes CPU images for amd64 only; Apple silicon runs it under emulation,
    # which is fine for this small model and an 11 document corpus.
    platform: linux/amd64
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    volumes:
      - cm_tei:/data

  agora:
    <<: *restart
    build:
      context: ../..
      dockerfile: deploy/company-memory/Dockerfile
    image: company-memory-pansoph:local
    command:
      - uvicorn
      - company_memory_mcp.agora_app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8080
      - --no-server-header
      - --no-access-log
    environment:
      <<: *pansoph-env
    volumes:
      - ./corpus:/corpus:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      spicedb: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp:
    <<: *restart
    image: company-memory-pansoph:local
    command: ["company-memory-mcp"]
    environment:
      <<: *pansoph-env
      CM_MCP_HOST: 0.0.0.0
      CM_MCP_PORT: "8765"
      CM_MCP_ALLOWED_HOSTS: localhost:8765,127.0.0.1:8765
      # Who may publish manually added knowledge to which shared scope (read only mount).
      CM_PUBLISH_POLICY_FILE: /etc/company-memory/publish-policy.json
    volumes:
      - ./publish-policy.json:/etc/company-memory/publish-policy.json:ro
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      agora: { condition: service_healthy }

volumes:
  cm_pgdata:
  cm_tei:
