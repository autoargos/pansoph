# Minimal two service stack for the live enforcement integration suite (Workstream B).
# It brings up ONLY a real SpiceDB and a real pgvector Postgres, nothing else (no models,
# no object store, no identity provider). Use it for `pytest -m integration`, never for
# production.
#
#   docker compose -f deploy/compose.test.yaml up -d --wait
#   export PANSOPH_SPICEDB_ENDPOINT=localhost:50051
#   export PANSOPH_PG_DSN=postgresql://pansoph:pansoph@localhost:5433/pansoph
#   uv sync --all-packages --group dev --group integration
#   uv run pytest -m integration -q
#   docker compose -f deploy/compose.test.yaml down -v
#
# serve-testing gives each distinct preshared key its own isolated, in memory datastore,
# so the suite uses a fresh key per test and needs no teardown between tests.
services:
  spicedb-test:
    image: authzed/spicedb:v1.47.1
    # The image's default entrypoint is not the binary, so set it explicitly (matches the
    # authzed docs `--entrypoint spicedb ... serve-testing`).
    entrypoint: ["spicedb"]
    command: ["serve-testing"]
    ports:
      - "50051:50051"

  pgvector-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pansoph
      POSTGRES_PASSWORD: pansoph
      POSTGRES_DB: pansoph
    ports:
      # Host 5433 to avoid colliding with a local Postgres on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pansoph -d pansoph"]
      interval: 3s
      timeout: 3s
      retries: 20
