# Static serving for the lens SPA, with API and SSE proxied to agora.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The container listens on 8080 but is published on another host port. Keep any
    # redirect relative so nginx never rewrites the host port (a directory redirect was
    # sending /connectors to http://host:8080/connectors/, breaking the route).
    absolute_redirect off;

    # Content-addressed build assets (hashed filenames): cache hard and forever. A new
    # deploy ships new hashes, so this is always safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client side routing. Intentionally no $uri/ probe: an SPA serves no
    # real directories, and probing for one makes nginx 301 a route that happens to match
    # a directory name (e.g. /connectors) to a trailing-slash URL. A real file still
    # serves directly ($uri), everything else falls through to the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # The SPA shell must never be cached, or a deploy is invisible until the browser
    # happens to revalidate: users keep loading a stale index.html that points at old
    # (now missing or outdated) asset hashes. Always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy API and SSE to agora. SSE needs buffering off and a long read timeout.
    location /api/ {
        # Resolve agora at request time via Docker's embedded DNS (127.0.0.11), not once
        # at startup. With a literal hostname nginx caches the upstream IP for the life of
        # the worker, so recreating the agora container (a new IP) strands lens on the dead
        # old IP and every /api call 502s. A variable host forces per-request resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agora_host agora;
        proxy_pass http://$agora_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
