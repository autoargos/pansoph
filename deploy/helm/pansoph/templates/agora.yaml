{{- $name := printf "%s-agora" (include "pansoph.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pansoph.labels" . | nindent 4 }}
    app.kubernetes.io/component: agora
spec:
  type: {{ .Values.agora.service.type }}
  selector:
    {{- include "pansoph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agora
  ports:
    - name: http
      port: {{ .Values.agora.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pansoph.labels" . | nindent 4 }}
    app.kubernetes.io/component: agora
spec:
  replicas: {{ .Values.agora.replicaCount }}
  selector:
    matchLabels:
      {{- include "pansoph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agora
  template:
    metadata:
      annotations:
        # Roll agora when the config or secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
      labels:
        {{- include "pansoph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agora
    spec:
      serviceAccountName: {{ include "pansoph.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agora
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/pansoph-agora:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "pansoph.configMapName" . }}
            - secretRef:
                name: {{ include "pansoph.secretName" . }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.agora.resources | nindent 12 }}
      {{- with .Values.agora.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agora.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agora.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
