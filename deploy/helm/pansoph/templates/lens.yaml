{{- define "pansoph.lensNginxConf" -}}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy API and SSE to the agora Service. The upstream is a literal name with no
    # variable, so nginx resolves it once at startup via the cluster DNS: correct here
    # because a Service ClusterIP is stable for the life of the Service, and kube-proxy
    # routes it to whatever agora pods are current. (Putting a variable like
    # $request_uri in proxy_pass would force per-request resolution and then need a
    # resolver directive, which is the Docker only workaround, not wanted in k8s.)
    # A bare proxy_pass with no path forwards the original request URI unchanged, so
    # /api/health reaches agora as /api/health. SSE needs buffering off and a long read.
    location /api/ {
        proxy_pass http://{{ printf "%s-agora" (include "pansoph.fullname" .) }}:{{ .Values.agora.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
{{- end -}}
{{- $name := printf "%s-lens" (include "pansoph.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-nginx
  labels:
    {{- include "pansoph.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens
data:
  # Kubernetes tuned nginx config for lens (see the named template above).
  default.conf: |
    {{- include "pansoph.lensNginxConf" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pansoph.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens
spec:
  type: {{ .Values.lens.service.type }}
  selector:
    {{- include "pansoph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lens
  ports:
    - name: http
      port: {{ .Values.lens.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pansoph.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens
spec:
  replicas: {{ .Values.lens.replicaCount }}
  selector:
    matchLabels:
      {{- include "pansoph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lens
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include "pansoph.lensNginxConf" . | sha256sum }}
      labels:
        {{- include "pansoph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lens
    spec:
      serviceAccountName: {{ include "pansoph.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: lens
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/pansoph-lens:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            {{- toYaml .Values.lens.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ $name }}-nginx
      {{- with .Values.lens.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lens.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lens.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
