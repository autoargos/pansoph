{{- if .Values.ingress.enabled }}
{{- $lens := printf "%s-lens" (include "pansoph.fullname" .) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pansoph.fullname" . }}
  labels:
    {{- include "pansoph.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # A single host: lens serves the SPA and proxies /api and SSE to agora, so one
    # backend covers the whole app.
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $lens }}
                port:
                  number: {{ .Values.lens.service.port }}
{{- end }}
