[project]
name = "pansoph-authz"
version = "0.0.1"
description = "Document level access control for retrieval: the enforcement architecture, the AuthzPort, SpiceDB and OpenFGA adapters, and source ACL to tuple mappers. Usable standalone."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Karande" }]
dependencies = ["pansoph-types>=0.0.1", "pydantic>=2.7", "httpx>=0.27"]

[project.optional-dependencies]
spicedb = ["authzed>=1.0"]
openfga = ["openfga-sdk>=0.9"]

# Authz adapters register here so an operator can drop in their own engine.
[project.entry-points."pansoph.authz"]
spicedb = "pansoph_authz.adapters.spicedb:SpiceDBAuthz"
openfga = "pansoph_authz.adapters.openfga:OpenFGAAuthz"
none = "pansoph_authz.adapters.noop:NoOpAuthz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pansoph_authz"]
