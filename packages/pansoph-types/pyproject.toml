[project]
name = "pansoph-types"
version = "0.0.1"
description = "Shared data shapes for pansoph: Document, AccessControl, DocRef, RawDoc. Zero runtime dependencies beyond pydantic."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Karande" }]
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pansoph_types"]
