[project]
name = "pansoph-ingestion"
version = "0.0.1"
description = "Ingestion building blocks: Parser and LLM ports, section aware chunking, contextual retrieval, and the durable IngestionWorkflow over DBOS or Hatchet. Usable standalone."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Karande" }]
dependencies = [
  "pansoph-types>=0.0.1",
  "pansoph-connector-sdk>=0.0.1",
  "pansoph-retrieval>=0.0.1",
  "pansoph-authz>=0.0.1",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
dbos = ["dbos>=0.20"]

[project.entry-points."pansoph.parsers"]
docling = "pansoph_ingestion.adapters_parser:DoclingParser"

[project.entry-points."pansoph.llms"]
openai_compatible = "pansoph_ingestion.adapters_llm:OpenAICompatibleLLM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pansoph_ingestion"]
