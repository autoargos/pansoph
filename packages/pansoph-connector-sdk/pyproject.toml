[project]
name = "pansoph-connector-sdk"
version = "0.0.1"
description = "The pansoph connector contract and declarative manifest runtime. Build connectors with zero pansoph platform dependency."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Karande" }]
dependencies = [
  "pansoph-types>=0.0.1",
  "pydantic>=2.7",
  "jsonpath-ng>=1.6",
  "pyyaml>=6",
  # The auth subsystem talks to OAuth token endpoints over HTTP and signs RS256
  # JWT assertions for the JWT-bearer grant. httpx matches the version used
  # across the workspace; pyjwt[crypto] matches pansoph-identity/pansoph-core.
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

# The connector scaffolding CLI: `pansoph-connector new <name>`.
[project.scripts]
pansoph-connector = "pansoph_connector_sdk.cli:main"

# Community connectors register themselves under this entry point group so the
# runtime can discover them as plugins. One group, many connectors.
[project.entry-points."pansoph.connectors"]
memory = "pansoph_connector_sdk.memory:InMemoryConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pansoph_connector_sdk"]
