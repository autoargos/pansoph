[project]
name = "pansoph-core"
version = "0.0.1"
description = "The thin pansoph assembly: settings, plugin registry, and the FastAPI REST plus MCP plus SSE surface. The UI is a replaceable consumer of these contracts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Karande" }]
dependencies = [
  "pansoph-types>=0.0.1",
  "pansoph-connector-sdk>=0.0.1",
  "pansoph-authz>=0.0.1",
  "pansoph-retrieval>=0.0.1",
  "pansoph-ingestion>=0.0.1",
  "pansoph-mcp-bridge>=0.0.1",
  "pansoph-identity>=0.0.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sse-starlette>=2.1",
  "mcp>=1.2",
]

# The runtime deps of the default adapters agora ships with, so a container running
# the default stack (pgvectorscale + SpiceDB + S3) has what it needs. Individual
# adapters remain optional on their own packages; this bundles the defaults.
[project.optional-dependencies]
stack = [
  "psycopg[binary]>=3.2",
  "authzed>=1.0",
  "qdrant-client>=1.12",
  "aioboto3>=13",
  "pyjwt[crypto]>=2.9",
  "croniter>=2.0",
]

[project.scripts]
pansoph = "pansoph_core.__main__:main"
pansoph-mcp = "pansoph_core.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pansoph_core"]
