name: release

# Build and push the deployable images (agora, scribe, lens) to Docker Hub on a
# version tag, generate an SBOM, and sign the images with cosign (keyless OIDC).
#
# Required repository secrets:
#   DOCKER_USERNAME  the Docker Hub user (e.g. cyproto)
#   DOCKER_PAT       a Docker Hub access token with push scope
# No other secrets are needed; cosign signing uses GitHub OIDC (id-token: write).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for cosign keyless signing

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [agora, scribe, lens]
    env:
      REGISTRY: docker.io
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/pansoph-${{ matrix.service }}
      # Pass the tag through env, never inline into a shell, to avoid ref injection.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

      # Supply chain scan: fail the release on a fixable Critical or High vulnerability in
      # the built image. This is the third leg (SBOM, scan, sign) of the supply chain gate.
      - name: Scan image for vulnerabilities (Grype)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
