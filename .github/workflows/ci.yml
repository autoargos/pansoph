name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # The enforcement path is type checked strictly and BLOCKING: a type bug in the
      # authz bulk check or the retrieval filter is a permission bug, so pansoph-authz and
      # pansoph-retrieval must pass mypy --strict on every PR.
      - name: Mypy (enforcement path, blocking)
        run: uv run mypy packages/pansoph-authz packages/pansoph-retrieval

      # The rest of the tree is type checked informationally until each package's adapters
      # are annotated, then folded into the blocking step above.
      - name: Mypy (rest, informational)
        run: uv run mypy packages || true

      - name: Pytest (unit)
        run: uv run pytest -m "not integration" -q

  # The document level access control red team. Once task #21 lands these become
  # the release gate. Runs separately so a green checkmark here means "permissions
  # are enforced", visibly and on its own.
  permission-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev
      - name: Permission red team
        run: uv run pytest -m permission -q

  # Connector conformance, hermetic and offline. Every connector that ships a
  # conformance.yaml or a marked conformance test runs here on every PR. A green
  # checkmark means each connector honors the contract and its ACL mapping, with no
  # live credentials and no network.
  conformance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev
      - name: Connector conformance (hermetic, offline)
        run: uv run pytest -m conformance -q

  # The grabber guardrail. Static, hermetic checks that the scout browser extension only
  # captures what the signed in user can see, on an explicit consent click, and never
  # bypasses auth, captures a credential, or solves a CAPTCHA (CLAUDE.md rule 5). A green
  # check means a regression cannot quietly turn the grabber into a scraper.
  grabber-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev
      - name: Grabber guardrail (rule 5)
        run: uv run pytest -m guardrail -q

  # The live enforcement gate. Brings up a real SpiceDB and a real pgvector and runs the
  # retrieval enforcement path against them, so a schema bug, a ZedToken freshness bug, or
  # a vector pre filter group leak fails the build. This is the live counterpart to
  # permission-gate (which runs on in-memory fakes): a green check here means permissions
  # hold against the real engines, not just the logic. Replaces the old
  # `pytest -m integration -q || true` no op as the project's integration signal.
  enforcement-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev --group integration
      - name: Start SpiceDB and pgvector
        run: docker compose -f deploy/compose.test.yaml up -d --wait
      - name: Wait for the gRPC and Postgres ports
        run: |
          wait_port() {
            for _ in $(seq 1 60); do
              (echo > /dev/tcp/127.0.0.1/"$1") >/dev/null 2>&1 && return 0
              sleep 1
            done
            echo "port $1 not ready"; return 1
          }
          wait_port 50051
          wait_port 5433
      - name: Live enforcement tests (real SpiceDB + pgvector)
        env:
          PANSOPH_SPICEDB_ENDPOINT: localhost:50051
          PANSOPH_PG_DSN: postgresql://pansoph:pansoph@localhost:5433/pansoph
        run: uv run pytest -m integration -q
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.test.yaml down -v
