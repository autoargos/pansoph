name: publish-dev

# Build and push the rolling development images (agora, scribe, lens) to Docker Hub,
# tagged :dev and :sha-<short>. This is what compose.yaml references by default, so a
# user can pull prebuilt images instead of building locally.
#
# This is the lightweight companion to release.yml. It does not run the supply chain
# gate (SBOM, vulnerability scan, cosign signing); those run only on a version tag,
# where they gate the signed, immutable release.
#
# Two ways to trigger:
#   - Manual: the "Run workflow" button (workflow_dispatch), always available.
#   - Automatic on push to main: opt in by setting the repository variable
#     PUBLISH_DEV_IMAGES to "true". It stays dormant until then, so the workflow never
#     fails before the Docker Hub secrets are configured.
#
# Required repository secrets:
#   DOCKER_USERNAME  the Docker Hub user (e.g. cyproto)
#   DOCKER_PAT       a Docker Hub access token with push scope

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "connectors/**"
      - "apps/lens/**"
      - "deploy/Dockerfile.*"
      - "deploy/lens.nginx.conf"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-dev.yml"

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-images:
    # Run on manual dispatch always; on push only when the maintainer has opted in and
    # the Docker Hub secrets exist. This keeps the workflow green on forks and before setup.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.PUBLISH_DEV_IMAGES == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [agora, scribe, lens]
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/pansoph-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
