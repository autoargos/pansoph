# NOT USED. connector.py (pansoph_connector_confluence.connector:ConfluenceConnector)
# is the authoritative implementation for this source, registered as the
# pansoph.connectors entry point in pyproject.toml.
#
# Confluence is not a simple declarative REST source: its ACL model requires
# reconstructing the inherited view-restriction cascade across a page's ancestors
# and falling back to the space View permission, and its change feed and deletion
# signal use CQL lastmodified plus a separate trashed-content poll. None of that fits
# the declarative manifest runtime, so this file is intentionally left as a stub and
# is ignored. Do not rely on it. See src/pansoph_connector_confluence/connector.py.
connector: confluence
